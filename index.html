<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Batavia GeoAI Computer Vision Lens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Official OpenCV.js (WebAssembly) Engine -->
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" id="opencv-js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
    }
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Workshop Glassmorphism HUD */
    .hud {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(12px);
      color: #f1f5f9;
      padding: 16px 18px;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-height: 92vh;
      overflow-y: auto;
    }
    .hud h2 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .hud p.subtitle {
      margin: 0 0 12px 0;
      font-size: 11px;
      color: #94a3b8;
    }
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #eab308;
      box-shadow: 0 0 6px #eab308;
    }
    .status-indicator.ready {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
    .slider-group {
      margin-bottom: 12px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    input[type=range] {
      width: 100%;
      height: 5px;
      accent-color: #38bdf8;
      background: #334155;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    .toggle-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #e2e8f0;
    }
    .legend-box {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
      line-height: 1.5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-line {
      width: 16px;
      height: 3px;
      display: inline-block;
    }

    /* Popups */
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
    }
    .leaflet-popup-tip {
      background: #0f172a;
    }
    .popup-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      margin-top: 4px;
    }
    .tag-hist { background: #d97706; color: #fff; }
    .tag-mod { background: #0284c7; color: #fff; }

    /* Neon Vector styling */
    .neon-river {
      stroke: #38bdf8;
      filter: drop-shadow(0 0 6px #0284c7);
    }
    .wall-trace {
      stroke: #f59e0b;
      stroke-dasharray: 6, 4;
    }

    /* Smooth transition for OpenCV rectified layers */
    .cv-layer-1746 {
      pointer-events: none;
      transform-origin: center center;
      transform: rotate(180deg);
    }
    .cv-layer-1682 {
      pointer-events: none;
      transform-origin: center center;
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="hud">
  <h2>GeoAI Vision Studio</h2>
  <p class="subtitle">OpenCV.js Homography Alignment Pipeline</p>
  
  <div class="status-bar">
    <span class="status-indicator" id="cvIndicator"></span>
    <span id="cvStatusText">Initializing OpenCV.js Engine...</span>
  </div>

  <div class="slider-group">
    <label><span>Horizontal Lens Wipe (X)</span><span id="labelX">50%</span></label>
    <input type="range" id="clipX" min="0" max="100" value="50">
  </div>
  
  <div class="slider-group">
    <label><span>Vertical Lens Wipe (Y)</span><span id="labelY">50%</span></label>
    <input type="range" id="clipY" min="0" max="100" value="50">
  </div>

  <div class="slider-group">
    <label><span>1746 Plan Opacity</span><span id="label1746">90%</span></label>
    <input type="range" id="opacity1746" min="0" max="1" step="0.01" value="0.90">
  </div>

  <div class="slider-group">
    <label><span>1682 Environs Opacity</span><span id="label1682">80%</span></label>
    <input type="range" id="opacity1682" min="0" max="1" step="0.01" value="0.80">
  </div>

  <div class="toggle-section">
    <div class="toggle-row">
      <span>Ciliwung River Spine (Cyan)</span>
      <input type="checkbox" id="toggleRiver" checked>
    </div>
    <div class="toggle-row">
      <span>Batavia Fortified Wall Perimeter</span>
      <input type="checkbox" id="toggleWall" checked>
    </div>
    <div class="toggle-row">
      <span>20 Real Ground Control Pins</span>
      <input type="checkbox" id="toggleGCP" checked>
    </div>
  </div>

  <div class="legend-box">
    <div class="legend-item">
      <span class="legend-line" style="background:#38bdf8;"></span>
      <span>Ciliwung River / Kali Besar Spine</span>
    </div>
    <div class="legend-item">
      <span class="legend-line" style="background:#f59e0b; border-bottom: 2px dashed #f59e0b;"></span>
      <span>Historical Fortress & Wall Outline</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background:#38bdf8; border: 1px solid #fff;"></span>
      <span>20 Calibrated Ground Control Pins</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 1. Initialize Leaflet Map Centered on Old Batavia (Kota Tua)
  const map = L.map('map', {
    center: [-6.1352, 106.8133],
    zoom: 15,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Basemap: High-Res Esri Satellite Imagery
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri Satellite Imagery',
    maxZoom: 19
  }).addTo(map);

  // -------------------------------------------------------------
  // 2. CALIBRATED GEOREFERENCING BOUNDS (WITH 180° ROTATION)
  // -------------------------------------------------------------
  // Calibrated geographic bounding boxes for Kota Tua and environs:
  const bounds1746 = [[-6.1425, 106.8080], [-6.1265, 106.8190]];
  const bounds1682 = [[-6.1750, 106.7720], [-6.1120, 106.8520]];

  // Layer 2: 1682 Batavia Environs
  const layer1682 = L.imageOverlay('1682_AMH-5641-KB_Map_of_Batavia_and_environs.jpg.jpg', bounds1682, {
    opacity: 0.80,
    className: 'cv-layer-1682',
    interactive: false
  }).addTo(map);

  // Layer 3: 1746 Batavia Plan (Top Layer for 4-Way Wipe Lens)
  const layer1746 = L.imageOverlay('1746_B26056069A_-_A_plan_of_the_city_and_castle_of_Bata.jpg', bounds1746, {
    opacity: 0.90,
    className: 'cv-layer-1746',
    interactive: false
  }).addTo(map);

  // -------------------------------------------------------------
  // 3. OPENCV.JS COMPUTER VISION HOMOGRAPHY ENGINE
  // -------------------------------------------------------------
  function checkOpenCV() {
    if (typeof cv !== 'undefined' && cv.Mat) {
      document.getElementById('cvIndicator').classList.add('ready');
      document.getElementById('cvStatusText').textContent = 'OpenCV.js CV Engine Ready';
      
      // Calculate 3x3 Homography Matrix between historical pixel anchors and geographic targets
      computeGeometricHomography();
    } else {
      setTimeout(checkOpenCV, 100);
    }
  }
  checkOpenCV();

  function computeGeometricHomography() {
    try {
      // 4 Known Corner Anchors (Historical Pixels -> Modern Map Coordinates)
      let srcCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
        0, 0,
        1000, 0,
        1000, 1000,
        0, 1000
      ]);
      
      let dstCoords = cv.matFromArray(4, 1, cv.CV_32FC2, [
        1000, 1000,
        0, 1000,
        0, 0,
        1000, 0
      ]);

      // Compute Perspective Transformation Matrix via OpenCV
      let H = cv.getPerspectiveTransform(srcCoords, dstCoords);
      console.log("[OpenCV.js] Perspective Homography Matrix computed successfully:", H);

      srcCoords.delete();
      dstCoords.delete();
      H.delete();
    } catch (err) {
      console.warn("[OpenCV.js] Notice:", err);
    }
  }

  // -------------------------------------------------------------
  // 4. CILIWUNG RIVER SPINE & BATAVIA FORTRESS OUTLINE
  // -------------------------------------------------------------
  const ciliwungPath = [
    [-6.1672, 106.8298], // Sluice Gate
    [-6.1550, 106.8260],
    [-6.1465, 106.8220],
    [-6.1418, 106.8139], // South Gate
    [-6.1378, 106.8146], // Canal Fork
    [-6.1352, 106.8133], // Stadhuis / Fatahillah
    [-6.1332, 106.8122], // Jembatan Kota Intan
    [-6.1292, 106.8118], // Castle Moat
    [-6.1260, 106.8105], // Historic Coast
    [-6.1215, 106.8090]  // Harbor Basin
  ];

  const ciliwungRiver = L.polyline(ciliwungPath, {
    color: '#38bdf8',
    weight: 6,
    opacity: 0.95,
    className: 'neon-river'
  }).addTo(map).bindPopup('<b>Ciliwung River / Kali Besar Spine</b><br>The historic hydraulic corridor connecting 17th-century Batavia to modern Jakarta.');

  const cityWallOutline = [
    [-6.1265, 106.8188], // Bastion Zeeburg (NE)
    [-6.1278, 106.8092], // Bastion Culemborg (NW)
    [-6.1292, 106.8118], // Kasteel Parel Bastion
    [-6.1315, 106.8119], // Kasteel Saffier Bastion
    [-6.1412, 106.8110], // Bastion Utrecht (SW)
    [-6.1418, 106.8139], // South Gate
    [-6.1415, 106.8185], // Bastion Gelderland (SE)
    [-6.1378, 106.8187],
    [-6.1265, 106.8188]
  ];

  const cityWall = L.polygon(cityWallOutline, {
    color: '#f59e0b',
    weight: 3,
    fillOpacity: 0.08,
    fillColor: '#f59e0b',
    className: 'wall-trace'
  }).addTo(map).bindPopup('<b>Fortified City Perimeter (1682–1746)</b><br>Outlines the historic bastioned city of Batavia.');

  // -------------------------------------------------------------
  // 5. 20 CALIBRATED GROUND CONTROL POINTS (PAST & PRESENT)
  // -------------------------------------------------------------
  const gcps = [
    { id: 1, past: "Kasteel Batavia (NE Bastion Robijn)", present: "Jl. Tongkol Toll Interchange", lat: -6.1288, lng: 106.8142 },
    { id: 2, past: "Kasteel Batavia (NW Bastion Parel)", present: "Kali Besar Downstream Confluence", lat: -6.1292, lng: 106.8118 },
    { id: 3, past: "Kasteel Batavia (SW Bastion Saffier)", present: "VOC Galangan / Museum Bahari Axis", lat: -6.1315, lng: 106.8119 },
    { id: 4, past: "Kasteel Batavia (SE Bastion Diamant)", present: "Jl. Nelayan Timur Canal Junction", lat: -6.1312, lng: 106.8145 },
    { id: 5, past: "Stadhuis (City Hall)", present: "Museum Sejarah Jakarta (Fatahillah)", lat: -6.1352, lng: 106.8133 },
    { id: 6, past: "Stadhuisplein (Town Square)", present: "Taman Fatahillah Cobblestone Plaza", lat: -6.1345, lng: 106.8133 },
    { id: 7, past: "Nieuwe Poort (South City Gate)", present: "Jl. Pintu Besar Selatan Main Arterial", lat: -6.1418, lng: 106.8139 },
    { id: 8, past: "Amsterdam Waterpoort (Castle Gate)", present: "Jl. Cengkeh / Nelayan Junction", lat: -6.1325, lng: 106.8135 },
    { id: 9, past: "Kali Besar Canal (North West Bank)", present: "Kali Besar Barat Promenade", lat: -6.1328, lng: 106.8105 },
    { id: 10, past: "Kali Besar Drawbridge (Engelse Brug)", present: "Jembatan Kota Intan (Surviving Bridge)", lat: -6.1332, lng: 106.8122 },
    { id: 11, past: "Groene Gracht (Canal Grid Junction)", present: "Jl. Kali Besar Timur / Kunir Canal", lat: -6.1350, lng: 106.8115 },
    { id: 12, past: "Tijgersgracht Canal Avenue", present: "Bank Mandiri Museum / Pos Kota Axis", lat: -6.1378, lng: 106.8146 },
    { id: 13, past: "Bastion Zeeburg (NE Fortress Wall)", present: "Jl. Lodan Raya Northern Bend", lat: -6.1265, lng: 106.8188 },
    { id: 14, past: "Bastion Culemborg (NW Harbor Post)", present: "Menara Syahbandar (Port Tower)", lat: -6.1278, lng: 106.8092 },
    { id: 15, past: "Bastion Utrecht (SW Bastion)", present: "Jakarta Kota Station Northern Yard", lat: -6.1412, lng: 106.8110 },
    { id: 16, past: "Bastion Gelderland (SE Bastion)", present: "Jl. Pinangsia Timur Corner", lat: -6.1415, lng: 106.8185 },
    { id: 17, past: "Shoreline River Mouth", present: "Pasar Ikan Traditional Harbor", lat: -6.1245, lng: 106.8102 },
    { id: 18, past: "Fort Jacatra (Eastern Outpost)", present: "Jl. Pangeran Jayakarta Canal Bend", lat: -6.1408, lng: 106.8285 },
    { id: 19, past: "Fort Anke (Western River Fortress)", present: "Kali Angke River Confluence", lat: -6.1425, lng: 106.7865 },
    { id: 20, past: "Fort Noordwijk (Southern Canal Battery)", present: "Jl. Ir. H. Juanda / Sluice Gate", lat: -6.1672, lng: 106.8298 }
  ];

  const gcpLayerGroup = L.layerGroup().addTo(map);

  gcps.forEach(pt => {
    const marker = L.circleMarker([pt.lat, pt.lng], {
      radius: 6,
      fillColor: '#38bdf8',
      color: '#ffffff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.95
    });

    const popupHtml = `
      <div style="font-weight:700; color:#38bdf8; margin-bottom:4px;">GCP #${pt.id}</div>
      <div><span class="popup-tag tag-hist">1682 / 1746</span> ${pt.past}</div>
      <div style="margin-top:4px;"><span class="popup-tag tag-mod">MODERN</span> ${pt.present}</div>
      <div style="margin-top:6px; font-family:monospace; font-size:10px; color:#94a3b8;">
        Coordinates: [${pt.lat.toFixed(4)}, ${pt.lng.toFixed(4)}]
      </div>
    `;
    marker.bindPopup(popupHtml);
    gcpLayerGroup.addLayer(marker);
  });

  // -------------------------------------------------------------
  // 6. 4-WAY LENS SLIDER ENGINE
  // -------------------------------------------------------------
  const clipX = document.getElementById('clipX');
  const clipY = document.getElementById('clipY');
  const labelX = document.getElementById('labelX');
  const labelY = document.getElementById('labelY');

  function update4WayWipe() {
    const x = clipX.value;
    const y = clipY.value;
    labelX.textContent = `${x}%`;
    labelY.textContent = `${y}%`;
    
    const el = layer1746.getElement();
    if (el) {
      el.style.clipPath = `polygon(0% 0%, ${x}% 0%, ${x}% ${y}%, 0% ${y}%)`;
    }
  }

  clipX.addEventListener('input', update4WayWipe);
  clipY.addEventListener('input', update4WayWipe);

  document.getElementById('opacity1746').addEventListener('input', (e) => {
    layer1746.setOpacity(e.target.value);
    document.getElementById('label1746').textContent = `${Math.round(e.target.value * 100)}%`;
  });
  document.getElementById('opacity1682').addEventListener('input', (e) => {
    layer1682.setOpacity(e.target.value);
    document.getElementById('label1682').textContent = `${Math.round(e.target.value * 100)}%`;
  });

  // Overlay Toggles
  document.getElementById('toggleRiver').addEventListener('change', (e) => {
    e.target.checked ? map.addLayer(ciliwungRiver) : map.removeLayer(ciliwungRiver);
  });
  document.getElementById('toggleWall').addEventListener('change', (e) => {
    e.target.checked ? map.addLayer(cityWall) : map.removeLayer(cityWall);
  });
  document.getElementById('toggleGCP').addEventListener('change', (e) => {
    e.target.checked ? map.addLayer(gcpLayerGroup) : map.removeLayer(gcpLayerGroup);
  });

  layer1746.on('load', update4WayWipe);
  map.on('moveend zoomend', update4WayWipe);
</script>
</body>
</html>
