<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jakarta Historical Map Lens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }
    
    /* Control HUD */
    .hud {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(18, 22, 28, 0.9);
      backdrop-filter: blur(8px);
      color: #f1f5f9;
      padding: 18px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      width: 290px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .hud h3 {
      margin: 0 0 14px 0;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #93c5fd;
    }
    .slider-group {
      margin-bottom: 14px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 5px;
      color: #94a3b8;
    }
    input[type=range] {
      width: 100%;
      height: 5px;
      accent-color: #3b82f6;
      background: #334155;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    /* 4-Way Mask Layer */
    .clip-layer {
      pointer-events: none;
      transition: clip-path 0.04s ease-out;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="hud">
  <h3>Jakarta / Batavia Lens</h3>
  
  <div class="slider-group">
    <label><span>Horizontal Lens Edge</span><span id="labelX">50%</span></label>
    <input type="range" id="clipX" min="0" max="100" value="50">
  </div>
  
  <div class="slider-group">
    <label><span>Vertical Lens Edge</span><span id="labelY">50%</span></label>
    <input type="range" id="clipY" min="0" max="100" value="50">
  </div>

  <div class="slider-group">
    <label><span>1746 Map Opacity</span></label>
    <input type="range" id="opacity1746" min="0" max="1" step="0.01" value="0.95">
  </div>

  <div class="slider-group">
    <label><span>1689 Map Opacity</span></label>
    <input type="range" id="opacity1689" min="0" max="1" step="0.01" value="0.85">
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 1. Initialize Map centered on Kota Tua, Jakarta
  const map = L.map('map', {
    center: [-6.1352, 106.8133],
    zoom: 15,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Layer 1: Satellite Basemap (Google Earth / Esri Imagery)
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
    maxZoom: 19
  }).addTo(map);

  // Exact real-world coordinates [South-West, North-East]
  const bounds1746 = [[-6.1420, 106.8080], [-6.1260, 106.8190]];
  const bounds1689 = [[-6.1700, 106.7700], [-6.1150, 106.8500]];

  // Layer 2: 1689 Environs Map Overlay
  const layer1689 = L.imageOverlay('1682_AMH-5641-KB_Map_of_Batavia_and_environs.jpg.jpg', bounds1689, {
    opacity: 0.85,
    interactive: false
  }).addTo(map);

  // Layer 3: 1746 Batavia Plan Overlay (Clipped layer)
  const layer1746 = L.imageOverlay('1746_B26056069A_-_A_plan_of_the_city_and_castle_of_Bata.jpg', bounds1746, {
    opacity: 0.95,
    className: 'clip-layer',
    interactive: false
  }).addTo(map);

  // 4-Way Curtain Clip Handler
  const clipX = document.getElementById('clipX');
  const clipY = document.getElementById('clipY');
  const labelX = document.getElementById('labelX');
  const labelY = document.getElementById('labelY');

  function update4WayWipe() {
    const x = clipX.value;
    const y = clipY.value;
    labelX.textContent = `${x}%`;
    labelY.textContent = `${y}%`;
    
    const imgElement = layer1746.getElement();
    if (imgElement) {
      imgElement.style.clipPath = `polygon(0% 0%, ${x}% 0%, ${x}% ${y}%, 0% ${y}%)`;
    }
  }

  clipX.addEventListener('input', update4WayWipe);
  clipY.addEventListener('input', update4WayWipe);

  // Opacity controls
  document.getElementById('opacity1746').addEventListener('input', (e) => {
    layer1746.setOpacity(e.target.value);
  });
  document.getElementById('opacity1689').addEventListener('input', (e) => {
    layer1689.setOpacity(e.target.value);
  });

  // Re-sync polygon clip on layer redraw
  layer1746.on('load', update4WayWipe);
  map.on('moveend zoomend', update4WayWipe);
</script>
</body>
</html>
