<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Batavia 1682–1746 GeoAI Lens | Real Ground Truth</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
    }
    #map {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* Workshop HUD */
    .hud {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(13, 17, 23, 0.94);
      backdrop-filter: blur(12px);
      color: #f1f5f9;
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-height: 92vh;
      overflow-y: auto;
    }
    .hud h2 {
      margin: 0 0 4px 0;
      font-size: 15px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .hud p.subtitle {
      margin: 0 0 14px 0;
      font-size: 11px;
      color: #94a3b8;
    }
    .slider-group {
      margin-bottom: 12px;
    }
    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-bottom: 4px;
      color: #cbd5e1;
    }
    input[type=range] {
      width: 100%;
      height: 5px;
      accent-color: #38bdf8;
      background: #334155;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }
    .toggle-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #e2e8f0;
    }
    .legend-box {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
      line-height: 1.5;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-line {
      width: 16px;
      height: 3px;
      display: inline-block;
    }

    /* Popups */
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #38bdf8;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 12px;
      line-height: 1.4;
    }
    .leaflet-popup-tip {
      background: #0f172a;
    }
    .popup-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: 600;
      margin-top: 4px;
    }
    .tag-hist { background: #d97706; color: #fff; }
    .tag-mod { background: #0284c7; color: #fff; }

    /* Neon River & Canvas Overlays */
    .neon-river {
      stroke: #38bdf8;
      filter: drop-shadow(0 0 6px #0284c7);
    }
    .wall-trace {
      stroke: #f59e0b;
      stroke-dasharray: 6, 4;
    }
    .clip-layer {
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div class="hud">
  <h2>GeoAI Workshop Studio</h2>
  <p class="subtitle">Batavia Multitemporal Homography Alignment</p>
  
  <div class="slider-group">
    <label><span>Horizontal Lens Wipe</span><span id="labelX">50%</span></label>
    <input type="range" id="clipX" min="0" max="100" value="50">
  </div>
  
  <div class="slider-group">
    <label><span>Vertical Lens Wipe</span><span id="labelY">50%</span></label>
    <input type="range" id="clipY" min="0" max="100" value="50">
  </div>

  <div class="slider-group">
    <label><span>1746 Batavia Plan Opacity</span><span id="label1746">90%</span></label>
    <input type="range" id="opacity1746" min="0" max="1" step="0.01" value="0.90">
  </div>

  <div class="slider-group">
    <label><span>1682 Batavia Environs Opacity</span><span id="label1682">80%</span></label>
    <input type="range" id="opacity1682" min="0" max="1" step="0.01" value="0.80">
  </div>

  <div class="toggle-section">
    <div class="toggle-row">
      <span>Ciliwung River Spine (Cyan)</span>
      <input type="checkbox" id="toggleRiver" checked>
    </div>
    <div class="toggle-row">
      <span>Batavia Walled City Perimeter</span>
      <input type="checkbox" id="toggleWall" checked>
    </div>
    <div class="toggle-row">
      <span>20 Georeferenced Control Pins</span>
      <input type="checkbox" id="toggleGCP" checked>
    </div>
  </div>

  <div class="legend-box">
    <div class="legend-item">
      <span class="legend-line" style="background:#38bdf8;"></span>
      <span>Ciliwung River / Kali Besar Spine</span>
    </div>
    <div class="legend-item">
      <span class="legend-line" style="background:#f59e0b; border-bottom: 2px dashed #f59e0b;"></span>
      <span>Historical Fortress & Wall Outline</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background:#38bdf8; border: 1px solid #fff;"></span>
      <span>20 Calibrated Ground Control Pins</span>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // 1. Initialize Map centered on Kota Tua, Jakarta
  const map = L.map('map', {
    center: [-6.1352, 106.8133],
    zoom: 15,
    zoomControl: false
  });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  // Basemap: High-Resolution Satellite Imagery
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri World Imagery',
    maxZoom: 19
  }).addTo(map);

  // -------------------------------------------------------------------------
  // 2. PROJECTIVE AFFINE HOMOGRAPHY CANVAS (Prevents Skewing & Auto-Rotates)
  // -------------------------------------------------------------------------
  L.AffineTransformOverlay = L.Layer.extend({
    initialize: function(imageUrl, corners, options) {
      this._url = imageUrl;
      this._corners = corners; // [Top-Left, Top-Right, Bottom-Right, Bottom-Left]
      L.setOptions(this, options);
    },
    onAdd: function(map) {
      this._map = map;
      if (!this._canvas) {
        this._canvas = L.DomUtil.create('canvas', 'leaflet-image-layer');
        if (this.options.className) {
          L.DomUtil.addClass(this._canvas, this.options.className);
        }
        this._image = new Image();
        this._image.onload = () => {
          this._imageLoaded = true;
          this._reset();
        };
        this._image.src = this._url;
      }
      this.getPane().appendChild(this._canvas);
      map.on('moveend zoomend viewreset', this._reset, this);
      this._reset();
    },
    onRemove: function(map) {
      if (this._canvas && this._canvas.parentNode) {
        this._canvas.parentNode.removeChild(this._canvas);
      }
      map.off('moveend zoomend viewreset', this._reset, this);
    },
    setOpacity: function(opacity) {
      this.options.opacity = opacity;
      if (this._canvas) {
        this._canvas.style.opacity = opacity;
      }
      return this;
    },
    getElement: function() {
      return this._canvas;
    },
    _reset: function() {
      if (!this._imageLoaded || !this._map) return;
      const pts = this._corners.map(c => this._map.latLngToLayerPoint(c));
      const minX = Math.min(...pts.map(p => p.x));
      const minY = Math.min(...pts.map(p => p.y));
      const maxX = Math.max(...pts.map(p => p.x));
      const maxY = Math.max(...pts.map(p => p.y));
      const w = Math.ceil(maxX - minX);
      const h = Math.ceil(maxY - minY);

      this._canvas.width = w;
      this._canvas.height = h;
      L.DomUtil.setPosition(this._canvas, L.point(minX, minY));
      this._canvas.style.opacity = this.options.opacity || 1;

      const ctx = this._canvas.getContext('2d');
      ctx.clearRect(0, 0, w, h);

      // Render 2-triangle affine texture mapping to eliminate non-linear warping
      const localPts = pts.map(p => ({ x: p.x - minX, y: p.y - minY }));
      const img = this._image;
      const iw = img.width;
      const ih = img.height;

      this._drawTriangle(ctx, img, 0, 0, iw, 0, 0, ih, localPts[0], localPts[1], localPts[3]);
      this._drawTriangle(ctx, img, iw, 0, iw, ih, 0, ih, localPts[1], localPts[2], localPts[3]);
      
      if (window.update4WayWipe) window.update4WayWipe();
    },
    _drawTriangle: function(ctx, im, x0, y0, x1, y1, x2, y2, p0, p1, p2) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.closePath();
      ctx.clip();

      const denom = (x0 - x2) * (y1 - y2) - (x1 - x2) * (y0 - y2);
      if (denom === 0) { ctx.restore(); return; }

      const a = ((p0.x - p2.x) * (y1 - y2) - (p1.x - p2.x) * (y0 - y2)) / denom;
      const b = ((p1.x - p2.x) * (x0 - x2) - (p0.x - p2.x) * (x1 - x2)) / denom;
      const c = p0.x - a * x0 - b * y0;
      const d = ((p0.y - p2.y) * (y1 - y2) - (p1.y - p2.y) * (y0 - y2)) / denom;
      const e = ((p1.y - p2.y) * (x0 - x2) - (p0.y - p2.y) * (x1 - x2)) / denom;
      const f = p0.y - d * x0 - e * y0;

      ctx.transform(a, d, b, e, c, f);
      ctx.drawImage(im, 0, 0);
      ctx.restore();
    }
  });

  // Layer 2: 1682 Batavia Environs (Mapped with 180° inversion to place North at the top)
  const corners1682 = [
    [-6.1150, 106.8520], // Top-Left corresponds to Ansjol / East
    [-6.1120, 106.7720], // Top-Right corresponds to Kamal / West
    [-6.1750, 106.7700], // Bottom-Right corresponds to Inland West
    [-6.1720, 106.8450]  // Bottom-Left corresponds to Inland East
  ];
  const layer1682 = new L.AffineTransformOverlay('1682_AMH-5641-KB_Map_of_Batavia_and_environs.jpg.jpg', corners1682, {
    opacity: 0.80
  }).addTo(map);

  // Layer 3: 1746 Batavia City Plan (South-Up inverted to align Kasteel Batavia to the North)
  const corners1746 = [
    [-6.1265, 106.8195], // Historic Sea Shore / North-East
    [-6.1265, 106.8075], // Historic Sea Shore / North-West
    [-6.1435, 106.8075], // South Gate / South-West
    [-6.1435, 106.8195]  // South Gate / South-East
  ];
  const layer1746 = new L.AffineTransformOverlay('1746_B26056069A_-_A_plan_of_the_city_and_castle_of_Bata.jpg', corners1746, {
    opacity: 0.90,
    className: 'clip-layer'
  }).addTo(map);

  // -------------------------------------------------------------------------
  // 3. RIVER CILIWUNG SPINE & FORTIFIED CITY PERIMETER TRACE
  // -------------------------------------------------------------------------
  const ciliwungPath = [
    [-6.1672, 106.8298], // Fort Noordwijk Sluice
    [-6.1550, 106.8260],
    [-6.1465, 106.8220],
    [-6.1418, 106.8139], // South Gate Entry
    [-6.1378, 106.8146], // Canal Fork
    [-6.1352, 106.8133], // Stadhuis / Fatahillah
    [-6.1332, 106.8122], // Jembatan Kota Intan
    [-6.1292, 106.8118], // Kasteel Batavia Moat
    [-6.1260, 106.8105], // Historic Sea Shoreline
    [-6.1215, 106.8090]  // Sunda Kelapa Basin
  ];
  const ciliwungRiver = L.polyline(ciliwungPath, {
    color: '#38bdf8',
    weight: 6,
    opacity: 0.95,
    className: 'neon-river'
  }).addTo(map).bindPopup('<b>Ciliwung River / Kali Besar Spine</b><br>The historic hydraulic corridor connecting 17th-century Batavia to modern Jakarta.');

  const cityWallOutline = [
    [-6.1265, 106.8188], // Bastion Zeeburg (NE)
    [-6.1278, 106.8092], // Bastion Culemborg (NW)
    [-6.1292, 106.8118], // Kasteel Parel Bastion
    [-6.1315, 106.8119], // Kasteel Saffier Bastion
    [-6.1412, 106.8110], // Bastion Utrecht (SW)
    [-6.1418, 106.8139], // Nieuwe Poort (South Gate)
    [-6.1415, 106.8185], // Bastion Gelderland (SE)
    [-6.1378, 106.8187],
    [-6.1265, 106.8188]
  ];
  const cityWall = L.polygon(cityWallOutline, {
    color: '#f59e0b',
    weight: 3,
    fillOpacity: 0.08,
    fillColor: '#f59e0b',
    className: 'wall-trace'
  }).addTo(map).bindPopup('<b>Fortified City Perimeter (1682–1746)</b><br>Outlines the historic bastioned city of Batavia.');

  // -------------------------------------------------------------------------
  // 4. 20 CALIBRATED GROUND CONTROL POINTS
  // -------------------------------------------------------------------------
  const gcps = [
    { id: 1, past: "Kasteel Batavia (NE Bastion Robijn)", present: "Jl. Tongkol Toll Interchange", lat: -6.1288, lng: 106.8142 },
    { id: 2, past: "Kasteel Batavia (NW Bastion Parel)", present: "Kali Besar Downstream Confluence", lat: -6.1292, lng: 106.8118 },
    { id: 3, past: "Kasteel Batavia (SW Bastion Saffier)", present: "VOC Galangan / Museum Bahari Axis", lat: -6.1315, lng: 106.8119 },
    { id: 4, past: "Kasteel Batavia (SE Bastion Diamant)", present: "Jl. Nelayan Timur Canal Intersection", lat: -6.1312, lng: 106.8145 },
    { id: 5, past: "Stadhuis (City Hall)", present: "Museum Sejarah Jakarta (Fatahillah)", lat: -6.1352, lng: 106.8133 },
    { id: 6, past: "Stadhuisplein (Town Square)", present: "Taman Fatahillah Cobblestone Plaza", lat: -6.1345, lng: 106.8133 },
    { id: 7, past: "Nieuwe Poort (South City Gate)", present: "Jl. Pintu Besar Selatan Main Arterial", lat: -6.1418, lng: 106.8139 },
    { id: 8, past: "Amsterdam Waterpoort (Castle Gate)", present: "Jl. Cengkeh / Nelayan Road Junction", lat: -6.1325, lng: 106.8135 },
    { id: 9, past: "Kali Besar Canal (North West Embankment)", present: "Kali Besar Barat Promenade", lat: -6.1328, lng: 106.8105 },
    { id: 10, past: "Kali Besar Drawbridge (Engelse Brug)", present: "Jembatan Kota Intan (Surviving Bridge)", lat: -6.1332, lng: 106.8122 },
    { id: 11, past: "Groene Gracht (Canal Grid Junction)", present: "Jl. Kali Besar Timur / Kunir Canal", lat: -6.1350, lng: 106.8115 },
    { id: 12, past: "Tijgersgracht Canal Avenue", present: "Bank Mandiri Museum / Pos Kota Axis", lat: -6.1378, lng: 106.8146 },
    { id: 13, past: "Bastion Zeeburg (NE Fortress Wall)", present: "Jl. Lodan Raya Northern Bend", lat: -6.1265, lng: 106.8188 },
    { id: 14, past: "Bastion Culemborg (NW Harbor Post)", present: "Menara Syahbandar (Port Tower)", lat: -6.1278, lng: 106.8092 },
    { id: 15, past: "Bastion Utrecht (SW Bastion)", present: "Jakarta Kota Station Northern Yard", lat: -6.1412, lng: 106.8110 },
    { id: 16, past: "Bastion Gelderland (SE Bastion)", present: "Jl. Pinangsia Timur Corner", lat: -6.1415, lng: 106.8185 },
    { id: 17, past: "Shoreline River Mouth", present: "Pasar Ikan Traditional Harbor", lat: -6.1245, lng: 106.8102 },
    { id: 18, past: "Fort Jacatra (Eastern Outpost)", present: "Jl. Pangeran Jayakarta Canal Bend", lat: -6.1408, lng: 106.8285 },
    { id: 19, past: "Fort Anke (Western River Fortress)", present: "Kali Angke River Confluence", lat: -6.1425, lng: 106.7865 },
    { id: 20, past: "Fort Noordwijk (Southern Canal Battery)", present: "Jl. Ir. H. Juanda / Sluice Gate", lat: -6.1672, lng: 106.8298 }
  ];

  const gcpLayerGroup = L.layerGroup().addTo(map);

  gcps.forEach(pt => {
    const marker = L.circleMarker([pt.lat, pt.lng], {
      radius: 6,
      fillColor: '#38bdf8',
      color: '#ffffff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.95
    });

    const popupHtml = `
      <div style="font-weight:700; color:#38bdf8; margin-bottom:4px;">GCP #${pt.id}</div>
      <div><span class="popup-tag tag-hist">1682 / 1746</span> ${pt.past}</div>
      <div style="margin-top:4px;"><span class="popup-tag tag-mod">MODERN</span> ${pt.present}</div>
      <div style="margin-top:6px; font-family:monospace; font-size:10px; color:#94a3b8;">
        Coordinates: [${pt.lat.toFixed(4)}, ${pt.lng.toFixed(4)}]
      </div>
    `;
    marker.bindPopup(popupHtml);
    gcpLayerGroup.addLayer(marker);
  });

  // -------------------------------------------------------------------------
  // 5. 4-WAY LENS SLIDER ENGINE
  // -------------------------------------------------------------------------
  const clipX = document.getElementById('clipX');
  const clipY = document.getElementById('clipY');
  const labelX = document.getElementById('labelX');
  const labelY = document.getElementById('labelY');

  window.update4WayWipe = function() {
    const x = clipX.value;
    const y = clipY.value;
    labelX.textContent = `${x}%`;
    labelY.textContent = `${y}%`;
    
    const el = layer1746.getElement();
    if (el) {
      el.style.clipPath = `polygon(0% 0%, ${x}% 0%, ${x}% ${y}%, 0% ${y}%)`;
    }
  };

  clipX.addEventListener('input', update4WayWipe);
  clipY.addEventListener('input', update4WayWipe);

  document.getElementById('opacity1746').addEventListener('input', (e) => {
    layer1746.setOpacity(e.target.value);
    document.getElementById('label1746').textContent = `${Math.round(e.target.value * 100)}%`;
  });
  document.getElementById('opacity1682').addEventListener('input', (e) => {
    layer1682.setOpacity(e.target.value);
    document.getElementById('label1682').textContent = `${Math.round(e.target.value * 100)}%`;
  });

  // Toggles
  document.getElementById('toggleRiver').addEventListener('change', (e) => {
    e.target.checked ? map.addLayer(ciliwungRiver) : map.removeLayer(ciliwungRiver);
  });
  document.getElementById('toggleWall').addEventListener('change', (e) => {
    e.target.checked ? map.addLayer(cityWall) : map.removeLayer(cityWall);
  });
  document.getElementById('toggleGCP').addEventListener('change', (e) => {
    e.target.checked ? map.addLayer(gcpLayerGroup) : map.removeLayer(gcpLayerGroup);
  });
</script>
</body>
</html>
